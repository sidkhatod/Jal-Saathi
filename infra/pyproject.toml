[project]
name = "infra"
version = "0.1.0"
description = "Jal-Saathi infra module"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib",
    "constructs>=10.8.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["cdk.out", ".venv", "asset.*"]
