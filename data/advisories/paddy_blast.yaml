name: "Paddy Blast"
crop: "paddy"
problem_name: "blast"
type: "disease"
growth_stage: "all"
symptoms: "Spindle-shaped or diamond-like eye spots with an ash-grey or whitish center and dark reddish-brown border on leaves. Dark brown rot at the collar."
organic_option: "Soak seeds in water containing Pseudomonas fluorescens (10g/kg) or mix with Trichoderma harzianum (5g/kg)."
chemical_option: "Trifloxystrobin 25% + Tebuconazole 50% WG, or Tricyclazole 45% + Hexaconazole 10% WG per CIB&RC label for this crop; confirm with your KVK."
weather_constraints: "Relative humidity > 90% (prolonged fog, morning dew) and temperatures of 20°C to 28°C."
