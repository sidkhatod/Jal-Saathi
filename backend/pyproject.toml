[project]
name = "backend"
version = "0.1.0"
description = "Jal-Saathi backend module"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "duckdb>=1.5.6",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pydantic",
    "pydantic-settings",
    "pyyaml>=6.0.3",
    "requests",
    "twilio",
]

[dependency-groups]
dev = [
    "moto[all]>=5.2.3",
    "pytest",
    "pytest-mock>=3.16.0",
    "ruff",
]
